title: Suspicious rundll32.exe invocation for MiniDump
id: 12345678-1234-1234-1234-1234567890ab
status: test
description: Detects the use of rundll32.exe to call MiniDump from comsvcs.dll, which is indicative of a credential dumping attack.
author: Your Name
date: 2023-04-01
logsource:
  product: windows
  service: Sysmon
  category: process_creation
detection:
  selection:
    EventID: 1
    Image: '*\\rundll32.exe'
    ParentImage: '*\\comsvcs.dll'
    CommandLine: '*MiniDump*'
  condition: selection
falsepositives:
  - Administrative tasks that use rundll32.exe
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
