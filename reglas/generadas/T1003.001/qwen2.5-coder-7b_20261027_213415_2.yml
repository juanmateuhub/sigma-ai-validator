title: Suspicious MiniDump Creation via rundll32.exe targeting lsass.exe
id: 12345678-1234-1234-1234-1234567890ab
status: test
description: Detects a potentially malicious MiniDump creation via rundll32.exe targeting lsass.exe, indicative of credential dumping.
author: Example Author
date: 2023-04-01
logsource:
  product: windows
  service: Sysmon
  category: process_creation
detection:
  selection:
    EventID: 1
    Image: 'C:\\Windows\\System32\\rundll32.exe'
    CommandLine: '*MiniDump*'
    ParentImage: 'C:\\Windows\\System32\\lsass.exe'
  condition: selection
falsepositives:
  - Normal administrative tasks
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
