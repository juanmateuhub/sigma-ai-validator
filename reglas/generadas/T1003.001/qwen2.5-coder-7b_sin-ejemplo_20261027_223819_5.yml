title: Memory Dump of LSASS with rundll32.exe
id: d4b7a3c5-e8f9-4d11-a2b3-c4d5e6f7890a
status: experimental
description: Detects an attempt to dump LSASS memory using rundll32.exe to extract credentials.
author: Example Author
date: 2023-04-01
logsource:
  product: windows
  service: Sysmon
  category: process_creation
detection:
  selection:
    Image: 'C:\Windows\System32\rundll32.exe'
    CommandLine: '*comsvcs.dll,MiniDump*lsass.exe*'
  condition: selection
falsepositives:
  - Normal system processes may use rundll32.exe for legitimate purposes.
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
