title: Suspicious Rundll32 MiniDump to Extract Credentials
id: 2e2b2c2d-2e2f-2e30-2e31-2e322e332e34
status: test
description: Detects an attack where an attacker uses PowerShell to call the MiniDump function from comsvcs.dll via rundll32.exe to dump the memory of lsass.exe, which is a common technique to extract credentials.
author: Your Name
date: 2023-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: 'C:\\Windows\\System32\\rundll32.exe'
    TargetFilename: 'comsvcs.dll!MiniDump'
    CommandLine: '*powershell*'
  condition: selection
falsepositives:
  - Normal use of rundll32.exe for legitimate purposes.
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
