title: Extracción de credenciales mediante volcado de memoria de lsass.exe  
id: a1b2c3d4-e5f6-4789-8a1b-2c3d4e5f6789  
status: experimental  
description: Detecta cuando un atacante usa PowerShell para llamar a rundll32.exe y volcar la memoria de lsass.exe con la función MiniDump, técnica utilizada para extraer credenciales.  
author: Detection Engineering  
date: 2026-10-27  
tags:  
    - attack.credential-access  
    - attack.t1003.001  
logsource:  
    product: windows  
    category: process_creation  
detection:  
    seleccion:  
        Image|endswith: '\rundll32.exe'  
        CommandLine|contains: 'comsvcs.dll,MiniDump'  
    filtro_legitimo:  
        ParentImage|endswith: '\powershell.exe'  
    condition: seleccion and not filtro_legitimo  
falsepositives:  
    - Uso legítimo de rundll32.exe para volcados de memoria por parte de herramientas autorizadas  
level: high
