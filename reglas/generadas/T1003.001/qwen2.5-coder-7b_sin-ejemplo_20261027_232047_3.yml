title: Suspicious MiniDump Creation via rundll32.exe
id: 12345678-1234-1234-1234-1234567890ab
status: test
description: Detects a process using rundll32.exe to call the MiniDump function from comsvcs.dll, which is indicative of a credential dumping attempt.
author: Jane Doe
date: 2023-04-01
logsource:
  product: windows
  service: Sysmon
  category: process_creation
detection:
  selection:
    Image: 'C:\\Windows\\System32\\rundll32.exe'
    ParentImage: 'C:\\Windows\\System32\\cmd.exe'
    CommandLine: '*comsvcs.dll,MiniDump*'
  condition: selection
falsepositives:
  - User may be using rundll32.exe for legitimate purposes.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
