title: MiniDump de lsass.exe a través de rundll32.exe
id: 9e3c1b8e-2d4a-4c6b-9e7f-1a2b3c4d5e6d
status: experimental
description: Detecta la ejecución de rundll32.exe con MiniDump de comsvcs.dll para volcar la memoria de lsass.exe, una técnica utilizada para el robo de credenciales.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains: 'comsvcs.dll,MiniDump'
    filtro_legitimo:
        ParentImage|endswith: '\services.exe'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Administradores que usan MiniDump para depuración
level: high
