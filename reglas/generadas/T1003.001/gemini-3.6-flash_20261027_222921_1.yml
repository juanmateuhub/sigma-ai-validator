title: Volcado de memoria de LSASS mediante comsvcs.dll y rundll32
id: e4b82d3f-8c11-4b6a-93ef-2a7f9a1b8c3d
status: experimental
description: Detecta el uso de rundll32.exe para llamar a la función MiniDump en comsvcs.dll y volcar la memoria del proceso lsass.exe a disco, una técnica común para el robo de credenciales.
author: Detection Engineering
date: 2026-03-29
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_rundll:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs.dll'
            - 'MiniDump'
    selection_lsass:
        CommandLine|contains: 'lsass'
    condition: selection_rundll and selection_lsass
falsepositives:
    - Uso legítimo e infrecuente por parte de administradores de sistemas para depuración de procesos.
level: high
