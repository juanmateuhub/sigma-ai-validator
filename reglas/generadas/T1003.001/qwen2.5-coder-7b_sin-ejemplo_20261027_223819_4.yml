title: Suspicious rundll32.exe Invocation for MiniDump
id: d4b8c9a1-f9c2-4e3d-a4b1-9c8f7e6d5e4f
status: test
description: Detects suspicious rundll32.exe invocation targeting lsass.exe with MiniDump, a technique often used for credential dumping.
author: Your Name
date: 2023-04-01
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection:
    EventID: 1
    ParentImage: "*\\powershell.exe"
    Image: "*\\rundll32.exe"
    CommandLine: "*MiniDump*"
  condition: selection
falsepositives:
  - Administrators using standard tools for legitimate purposes
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
