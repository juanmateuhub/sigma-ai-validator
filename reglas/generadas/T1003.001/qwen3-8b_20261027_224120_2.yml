title: Dumping lsass.exe Memory via rundll32.exe with MiniDump  
id: 123e4567-e89b-12d3-a456-426614174000  
status: experimental  
description: Detecta el uso de rundll32.exe para llamar a la función MiniDump de comsvcs.dll y volcar la memoria de lsass.exe, técnica usada para extraer credenciales.  
author: Detection Engineering  
date: 2026-10-27  
tags:  
    - attack.credential-access  
    - attack.t1003.001  
logsource:  
    product: windows  
    category: process_creation  
detection:  
    selection:  
        Image|endswith: '\rundll32.exe'  
        CommandLine|contains|all:  
            - 'comsvcs.dll'  
            - 'MiniDump'  
    filtro_legitimo:  
        ParentImage|endswith: '\powershell.exe'  
    condition: selection and not filtro_legitimo  
falsepositives:  
    - Uso legítimo de rundll32.exe para funciones de sistema  
level: high
