title: Suspicious MiniDump Creation by rundll32.exe
id: 5b3e4d5d-4b3e-4d5d-4b3e-4d5d4b3e4d5d
status: test
description: Detects the creation of a MiniDump file by rundll32.exe, which is indicative of a potential credential dumping attack.
author: Jane Doe
date: 2023-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: 'C:\\Windows\\System32\\rundll32.exe'
    CommandLine: '*MiniDump*comsvcs.dll*lsass.exe*'
  condition: selection
falsepositives: 
  - Legitimate administrative tasks that involve memory dumps for debugging or troubleshooting.
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
