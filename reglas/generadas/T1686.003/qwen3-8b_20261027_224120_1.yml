title: Configuración de regla de firewall para Python en PowerShell  
id: 3a8e6f9d-1b7c-4d5e-8f2a-9c0d1e2f3a4b  
status: experimental  
description: Detecta cuando un atacante usa PowerShell para crear una regla de firewall con netsh advfirewall que permite conexiones a python.exe, probablemente para establecer un servidor web.  
author: Detection Engineering  
date: 2026-10-27  
tags:  
    - attack.command-and-control  
    - attack.t1021  
logsource:  
    product: windows  
    category: process_creation  
detection:  
    seleccion:  
        Image|endswith: '\powershell.exe'  
        CommandLine|contains|all:  
            - 'netsh'  
            - 'advfirewall'  
            - 'add'  
            - 'inbound'  
            - 'python.exe'  
    filtro_legitimo:  
        ParentImage|endswith: '\msiexec.exe'  
    condition: seleccion and not filtro_legitimo  
falsepositives:  
    - Administradores que configuran reglas de firewall para Python en entornos legítimos  
level: high
