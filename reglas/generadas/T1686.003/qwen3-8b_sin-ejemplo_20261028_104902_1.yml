title: "Firewall Rule Addition via PowerShell for Python Server"
id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
status: "experimental"
description: "Detects when an attacker uses PowerShell to add a firewall rule via netsh to allow connections to a Python server."
author: "Security Team"
date: "2023-10-15"
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: "powershell.exe"
    CommandLine|contains: "netsh advfirewall firewall add rule"
    CommandLine|contains: "program=python.exe"
    CommandLine|contains: "action=allow"
  condition: selection
falsepositives:
  - "Legitimate use of netsh for firewall configuration"
level: "high"
tags:
  - attack.credential-access
  - attack.t1003.001
