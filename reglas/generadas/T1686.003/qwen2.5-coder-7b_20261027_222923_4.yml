title: Añadir regla de entrada al cortafuegos con netsh para permitir conexión a python.exe
id: 6b8c9d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: experimental
description: Detecta el uso de netsh advfirewall para añadir una regla de entrada al cortafuegos de Windows que permite conexiones a python.exe, técnica usada para exfiltrar datos.
author: Detection Engineering
date: 2026-10-28
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'netsh advfirewall firewall add rule'
            - 'name="PythonWebServer"'
            - 'dir=in'
            - 'action=allow'
            - 'program="C:\\path\\to\\python.exe"'
    filtro_legitimo:
        ParentImage|endswith: '\msiexec.exe'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Administradores que usan PowerShell para administrar el cortafuegos de forma legítima
level: high
