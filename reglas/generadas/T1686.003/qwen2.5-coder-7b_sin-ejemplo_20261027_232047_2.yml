title: Suspicious Netsh Advfirewall Command Execution
id: f8e4c13b-5e4d-4e4c-a1b2-c3d4e5f6a7b8
status: experimental
description: Detects the execution of a suspicious netsh advfirewall command that appears to be part of an attempt to create a backdoor or establish persistence.
author: John Doe
date: 2023-04-01
logsource:
  product: windows
  service: Sysmon
  category: process_creation
detection:
  selection:
    Image: "*\\powershell.exe"
    CommandLine: "*netsh advfirewall firewall add rule name=\"*\" dir=in action=allow protocol=tcp localport=* program=\"*\\python.exe\"*"
  condition: selection
falsepositives:
  - Administrative tasks that involve modifying firewall rules.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
