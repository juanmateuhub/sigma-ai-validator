title: Persistencia en Run mediante Empire
id: 3f3c1b8e-2d4a-4c6b-9e7f-1a2b3c4d5e6f
status: stable
description: Detecta la escritura en la clave del registro Run por Empire para lograr persistencia.
author: Detection Engineering
date: 2026-11-01
tags:
    - attack.persistence
    - attack.t1047
logsource:
    product: windows
    category: registry_event
detection:
    registro_persistencia:
        EventID: 4657
        TargetObject|endswith: 'HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'
        Details|contains: 'powershell.exe'
    condition: registro_persistencia
falsepositives:
    - Administradores que usan scripts de PowerShell para automatizar tareas
level: high
