title: Persistence via Registry Run Key with Empire
id: 3a8e4c6d-1f9b-4c7e-8d6a-2b5c3d4e5f6a
status: experimental
description: Detecta cuando Empire establece persistencia escribiendo en la clave HKCU\Software\Microsoft\Windows\CurrentVersion\Run para lanzar powershell.exe con un comando codificado.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.persistence
    - attack.t1134.001
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'
            - 'powershell.exe'
    filtro_legitimo:
        ParentImage|endswith: '\explorer.exe'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Ediciones legítimas de registros por administradores
level: high
