title: Suspicious mshta.exe Execution with PowerShell Command
id: e7d8e4c0-7c9b-11ec-81e2-0242ac120003
status: test
description: Detects the execution of mshta.exe with a PowerShell command embedded in the command line, which is indicative of a potential PowerShell injection attack.
author: Your Name
date: 2022-01-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: "*\\mshta.exe"
    CommandLine: "*vbscript:Execute*"
  condition: selection
falsepositives:
  - Administrators using legitimate scripts
level: high
tags:
  - attack.execution
  - attack.t1059.001
