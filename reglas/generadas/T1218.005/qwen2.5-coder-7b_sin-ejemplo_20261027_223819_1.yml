title: PowerShell Execution via mshta.exe with VBScript Inline Code
id: 123e4567-e89b-12d3-a456-426614174000
status: test
description: Detects the execution of PowerShell via mshta.exe with VBScript code inline, which is indicative of a potential attack that avoids file persistence.
author: Example Author
date: 2023-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    CommandLine: '*mshta.exe vbscript:Execute*'
  condition: selection
falsepositives: 
  - Normal administrative tasks that require PowerShell execution.
level: high
tags:
  - attack.execution
  - attack.t1003.001
