title: Ejecucion de PowerShell mediante Mshta con Inline VBScript
id: e4b8c9d1-3a2b-4f5e-8d9c-1b2a3c4d5e6f
status: experimental
description: Detecta el uso de mshta.exe ejecutado desde cmd.exe que contiene codigo VBScript en la linea de comandos (vbscript:Execute) para lanzar PowerShell en memoria.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.stealth
    - attack.t1218.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\cmd.exe'
        Image|endswith: '\mshta.exe'
        CommandLine|contains|all:
            - 'vbscript:'
            - 'Execute'
            - 'powershell'
    condition: selection
falsepositives:
    - Scripts de administracion legitimos muy poco frecuentes
level: high
