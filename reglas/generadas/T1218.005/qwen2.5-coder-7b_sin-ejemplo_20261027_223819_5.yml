title: Suspicious mshta.exe execution with PowerShell via VBScript
id: 12345678-1234-1234-1234-1234567890ab
status: test
description: Detects the execution of mshta.exe with a VBScript command that includes PowerShell, which is indicative of a potential credential access attempt.
author: Example Author
date: 2023-04-01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image: "*\\mshta.exe"
    CommandLine: "*vbscript:Execute*powershell*"
  condition: selection
falsepositives:
  - Normal administrative use of mshta.exe to run VBScript code.
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
