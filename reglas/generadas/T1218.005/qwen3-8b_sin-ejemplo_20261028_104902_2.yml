title: "Suspicious mshta.exe Execution with VBScript to Launch PowerShell"
id: "123e4567-e89b-12d3-a456-426614174000"
status: "experimental"
description: "Detection of mshta.exe executing VBScript code via command line to launch PowerShell without persisting files on disk."
author: "Security Team"
date: "2023-10-15"
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: mshta.exe
    CommandLine|contains: "vbscript:Execute"
    ParentImage: cmd.exe
  condition: selection
falsepositives:
  - "Legitimate use of mshta.exe for scripting"
level: "high"
tags:
  - attack.credential-access
  - attack.t1003.001
