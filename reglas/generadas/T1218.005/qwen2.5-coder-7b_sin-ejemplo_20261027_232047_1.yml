title: "Potential PowerShell Execution via mshta.exe with VBScript"
id: 01234567-89ab-cdef-0123-456789abcdef
status: test
description: "Detects execution of PowerShell via mshta.exe with VBScript embedded in the command line, which may indicate a potential C2 channel or script-based attack."
author: John Doe
date: 2023-04-01
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection:
    ParentImage: "C:\\Windows\\System32\\cmd.exe"
    Image: "C:\\Windows\\System32\\mshta.exe"
    CommandLine: "*vbscript:Execute*"
  condition: selection
falsepositives:
  - "Legitimate use of mshta.exe for legitimate VBScript execution."
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
