title: Suspicious use of mshta.exe with embedded VBScript for PowerShell execution
id: 123e4567-e89b-12d3-a456-426614174000
status: test
description: Detects the execution of mshta.exe with VBScript embedded in the command line for PowerShell execution without leaving any files on disk.
author: John Doe
date: 2023-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: 'C:\Windows\System32\mshta.exe'
    CommandLine: '*vbscript:Execute*'
  condition: selection
falsepositives:
  - Legitimate use of VBScript for legitimate purposes.
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
