title: Ejecución de Seatbelt para reconocimiento de usuarios
id: 7f4d5e6a-3b2c-4d5e-9f0a-1b2c3d4e5f6a
status: experimental
description: Detecta la ejecución de Seatbelt.exe con el objetivo de reconocer el sistema y la configuración del usuario, una técnica común en reconocimiento de penetración.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.execution
    - attack.t1083
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\Seatbelt.exe'
        CommandLine|contains: '-group=user'
    filtro_legitimo:
        ParentImage|endswith: '\cmd.exe'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Administradores que usan Seatbelt para auditoría de sistemas
level: high
