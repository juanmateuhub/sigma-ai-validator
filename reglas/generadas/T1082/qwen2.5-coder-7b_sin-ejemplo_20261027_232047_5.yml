title: Seatbelt User Group Check Execution
id: f6b8c9d0-e1f2-11eb-80d8-0242ac120002
status: test
description: Detects the execution of Seatbelt.exe with the -group=user argument from cmd.exe, which is indicative of reconnaissance activities.
author: Example Author
date: 2021/09/01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: '*\\cmd.exe'
    CommandLine: '*Seatbelt.exe -group=user*'
  condition: selection
falsepositives:
  - Normal administrative activity.
level: medium
tags:
  - attack.credential-access
  - attack.t1003.001
