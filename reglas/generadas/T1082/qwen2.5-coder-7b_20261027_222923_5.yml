title: Ejecución de Seatbelt con el grupo de comprobaciones de usuario
id: 7b8c9d0e-3f4a-5b6c-7d8e-9f0a1b2c3d4e
status: experimental
description: Detecta la ejecución de Seatbelt.exe con el grupo de comprobaciones de usuario, técnica usada para reconocer el sistema y la configuración del usuario.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.discovery
    - attack.t1018
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\Seatbelt.exe'
        CommandLine|contains: '-group=user'
    filtro_legitimo:
        ParentImage|endswith: '\cmd.exe'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Administradores que usan Seatbelt para auditorías legítimas
level: high
