title: Seatbelt.exe Used for User Group Enumeration  
id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"  
status: experimental  
description: Detection of Seatbelt.exe execution from cmd.exe with -group=user parameter to enumerate user groups.  
author: Cybersecurity Team  
date: 2023-10-25  
logsource:  
  product: windows  
  category: process_creation  
detection:  
  selection:  
    Image: Seatbelt.exe  
    ParentImage: cmd.exe  
    CommandLine: "*-group=user*"  
  condition: selection  
tags:  
  - attack.credential-access  
  - attack.t1003.001  
falsepositives:  
  - Legitimate use of Seatbelt.exe for auditing  
level: high
