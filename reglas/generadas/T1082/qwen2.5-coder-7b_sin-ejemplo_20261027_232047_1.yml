title: Seatbelt Execution with User Group Check
id: 12345678-1234-1234-1234-1234567890ab
status: test
description: Detects the execution of Seatbelt.exe with the -group=user argument, which is commonly used for reconnaissance.
author: John Doe
date: 2023-04-01
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection:
    Image: "*\\Seatbelt.exe"
    CommandLine: "*-group=user*"
  condition: selection
falsepositives:
  - Normal users may run Seatbelt for legitimate purposes.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
