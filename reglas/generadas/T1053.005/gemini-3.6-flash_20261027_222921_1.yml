title: Creacion remota de tarea programada mediante schtasks desde PowerShell
id: d7f2a1b9-3e8c-4f5a-b61d-9e2f4a1c5b8d
status: experimental
description: Detecta la ejecución de cmd.exe invocando schtasks.exe con los parámetros /create, /s (equipo remoto) y cmd.exe en el comando a ejecutar, teniendo como proceso padre a PowerShell.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.execution
    - attack.t1059.001
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmd:
        Image|endswith: '\cmd.exe'
        CommandLine|contains|all:
            - 'schtasks'
            - '/create'
            - '/s'
            - 'cmd'
    condition: selection_parent and selection_cmd
falsepositives:
    - Scripts de administración remota legítimos creados por administradores de sistemas.
level: high
