title: Suspicious Scheduled Task Creation Using PowerShell
id: 123e4567-e89b-12d3-a456-426614174000
status: test
description: Detects the creation of a scheduled task using PowerShell that involves executing a command on a remote machine.
author: Example Author
date: 2023-04-01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image: "*powershell.exe"
    CommandLine: "*schtasks /create /s *"
  condition: selection
falsepositives:
  - Normal use of PowerShell for legitimate administrative tasks
level: medium
tags:
  - attack.credential-access
  - attack.t1003.001
