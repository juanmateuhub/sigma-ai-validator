title: "Remote Scheduled Task Creation via schtasks"
id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
status: "experimental"
description: "Detects remote scheduled task creation via schtasks from PowerShell, indicating potential credential access."
author: "Security Team"
date: "2023-10-25"
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: 'powershell.exe'
    CommandLine|contains:
      - 'schtasks /create /s'
      - 'cmd.exe /C'
  condition: selection
tags:
  - attack.credential-access
  - attack.t1003.001
falsepositives:
  - Legitimate administrative task creation
level: "high"
