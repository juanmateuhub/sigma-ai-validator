title: Suspicious Scheduled Task Creation via PowerShell
id: 123e4567-e89b-12d3-a456-426614174000
status: test
description: Detects suspicious scheduled task creation via PowerShell that utilizes cmd.exe to execute a command on a remote system.
author: John Doe
date: 2023-04-01
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image: "*powershell.exe"
    CommandLine: "*cmd.exe /C schtasks /create /s *"
  condition: selection
falsepositives:
  - Normal use of PowerShell for administrative tasks
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
