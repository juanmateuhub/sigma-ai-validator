title: Creación de tarea programada remota por PowerShell
id: 5f3c1b8e-2d4a-4c6b-9e7f-1a2b3c4d5e6f
status: experimental
description: Detecta la creación de una tarea programada remota usando PowerShell, técnica usada para escalada de privilegios y control de sistemas remotos.
author: Detection Engineering
date: 2026-10-27
tags:
    - attack.privilege-escalation
    - attack.t1053
logsource:
    product: windows
    category: process_creation
detection:
    seleccion:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'schtasks'
            - '/create'
            - '/s'
    filtro_legitimo:
        CommandLine|contains: 'schtasks /create /tn'
    condition: seleccion and not filtro_legitimo
falsepositives:
    - Administradores que usan PowerShell para administrar sistemas remotos
level: high
